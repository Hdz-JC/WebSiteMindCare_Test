server {
    listen 80;
    server_name _;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Optimización
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json;

    # ==========================================
    # SEGURIDAD: Bloqueos (Lo que pediste)
    # ==========================================
    
    # Bloquear archivos .env, git, y ocultos
    location ~ /\. { deny all; return 404; }
    
    # Bloquear código fuente
    location ~ \.(py|pyc|rb|php|java|go|ts|tsx)$ { deny all; return 404; }

    # Bloquear archivos de Docker y documentación interna
    location ~ ^/(README|LICENSE|requirements\.txt|Dockerfile|docker-compose\.yml) {
        deny all;
        return 404;
    }

    # ==========================================
    # CONEXIÓN CON FLASK (Lo que faltaba)
    # ==========================================
    
    location / {
        # IMPORTANTE: Esto envía la petición a tu contenedor 'web'
        proxy_pass http://web:5000;
        
        # Cabeceras necesarias
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (opcional, por si Flask tarda mucho en responder)
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Health Check
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}