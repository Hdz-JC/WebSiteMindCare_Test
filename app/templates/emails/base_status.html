<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MindCare{% endblock %}</title>
    <style>
        :root {
            --brand-color: #00ABB5;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-light: #666;
            /* Esta variable se sobreescribe en cada hijo */
            --theme-color: #00ABB5; 
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 6px solid var(--theme-color);
            transition: transform 0.3s ease;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            color: var(--theme-color);
        }
        h2 { color: var(--text-main); margin: 0 0 10px; font-size: 24px; }
        p { color: var(--text-light); line-height: 1.6; margin-bottom: 20px; }
        
        /* Caja de detalles (Fecha/Hora) */
        .details-box {
            background-color: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--theme-color);
            margin-bottom: 25px;
            text-align: left;
            font-size: 0.95rem;
            color: #444;
        }
        .details-box strong { color: var(--text-main); }

        .btn {
            display: inline-block;
            text-decoration: none;
            background-color: var(--text-main);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover { background-color: #000; transform: translateY(-2px); }
        .footer { margin-top: 20px; font-size: 12px; color: #999; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="card">
        <div class="icon">
            {% block icon %}ℹ{% endblock %}
        </div>
        
        <h2>{% block heading %}Título{% endblock %}</h2>
        
        <div class="content">
            {% block content %}{% endblock %}
        </div>

        {% block action %}
            <a href="/" class="btn">Ir al Inicio</a>
        {% endblock %}

        <div class="footer">MindCare &copy; {{ fecha_actual }}</div>
    </div>
</body>
</html>
