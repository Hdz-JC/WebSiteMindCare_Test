<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recordatorio MindCare</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f7f6; font-family: 'Segoe UI', Arial, sans-serif;">
    
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td align="center" style="padding: 40px 10px;">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 600px; width: 100%;">
                    
                    <tr>
                        <td bgcolor="#00ABB5" style="padding: 30px; text-align: center; color: white;">
                            <h1 style="margin: 0; font-size: 24px; font-weight: normal;">Recordatorio de Cita</h1>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 40px 30px; text-align: center; color: #333333;">
                            <p style="font-size: 16px; line-height: 1.5; margin-bottom: 25px;">Hola, tienes una cita programada en <strong>MindCare</strong>.</p>
                            
                            <div style="background-color: #E0F7FA; border: 1px solid #B2EBF2; border-radius: 8px; padding: 20px; margin-bottom: 30px; display: inline-block; text-align: left;">
                                <p style="margin: 5px 0; color: #006064; font-size: 18px;">📅 <strong>{{ fecha }}</strong></p>
                                <p style="margin: 5px 0; color: #006064; font-size: 18px;">⏰ <strong>{{ horainicio }}</strong></p>
                            </div>

                            <p style="margin-bottom: 30px; color: #666;">Selecciona una opción:</p>

                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center">
                                        <a href="{{ confirm_url }}" style="background-color: #22C55E; color: #ffffff; padding: 12px 25px; text-decoration: none; border-radius: 50px; font-weight: bold; margin: 0 10px; display: inline-block;">✔ Confirmar</a>
                                        
                                        <a href="{{ cancel_url }}" style="background-color: #EF4444; color: #ffffff; padding: 12px 25px; text-decoration: none; border-radius: 50px; font-weight: bold; margin: 0 10px; display: inline-block;">✖ Cancelar</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td bgcolor="#fafafa" style="padding: 20px; text-align: center; color: #999999; font-size: 12px;">
                            <p style="margin: 0;">MindCare - Salud Mental</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
