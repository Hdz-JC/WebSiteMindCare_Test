{% extends 'base.html' %}

{% block title %} Registro {% endblock %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style_registro.css') }}">
{% endblock %}

{% block content %}
<form class="formulario" 
      action="{{ url_for('main_bp.registro') }}" 
      method="POST"
      onsubmit="return validarRegistro()">

    <h2>Datos del paciente</h2>

    <fieldset id="datosPersonales">
        <legend>Datos personales</legend>
        <div class="fila">
            <input type="text" id="paterno" name="paterno" placeholder="Apellido paterno" required>
            <input type="text" id="materno" name="materno" placeholder="Apellido materno">
        </div>
        <div class="fila">
            <input type="text" id="nombre" name="nombre" placeholder="Nombre(s)" required>
            <input type="number" id="edad" name="edad" placeholder="Edad" min="1" max="120" required>
            <input type="date" name="fecha_nacimiento" placeholder="Fecha de nacimiento">
        </div>
        <div class="fila">
            <label>Sexo:</label>
            <label><input type="radio" name="sexo" value="F" required> F</label>
            <label><input type="radio" name="sexo" value="M"> M</label>
        </div>
    </fieldset>

    <fieldset id="datosContacto">
        <legend>Datos de contacto</legend>
        <input type="text" name="direccion" placeholder="Dirección">
        <input type="tel" id="celular" name="celular" placeholder="Teléfono celular">
        <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
        <input type="password" id="password" name="password" placeholder="Contraseña" required>
    </fieldset>

    <div class="botones">
        <button type="reset">Cancelar</button>
        <button type="submit">Aceptar</button>
    </div>
</form>
{% endblock %}

<script>
function validarRegistro() {
  const errores = []
  // Tomamos los valores por ID
  const paterno = document.getElementById("paterno").value.trim();
  const materno = document.getElementById("materno").value.trim();
  const nombre = document.getElementById("nombre").value.trim();
  const edad = document.getElementById("edad").value.trim();
  const celular = document.getElementById("celular").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  // Expresiones regulares
  const nombreRegex = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{2,30}$/;
  const edadRegex = /^(?:[1-9][0-9]?|1[01][0-9]|120)$/;
  const celularRegex = /^\d{10}$/;
  const emailRegex = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;
  const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/;

  if (!nombreRegex.test(paterno)) errores.push("Apellido paterno inválido (solo letras y espacios).");
  if (materno && !nombreRegex.test(materno)) errores.push("Apellido materno inválido.");
  if (!nombreRegex.test(nombre)) errores.push("Nombre inválido (solo letras y espacios).");
  if (!edadRegex.test(edad)) errores.push("Edad inválida (1-120).");
  if (celular && !celularRegex.test(celular)) errores.push("Teléfono celular debe tener 10 dígitos numéricos.");
  if (!emailRegex.test(email)) errores.push("Correo electrónico inválido.");
  if (!passwordRegex.test(password)) errores.push("La contraseña debe tener al menos 6 caracteres, con letras y números.");

  if (errores.length > 0) {
    Swal.fire({
      icon: "error",
      title: "Errores en el formulario",
      html: errores.join("<br>")  // muestra todos los errores juntos
    });
    return false; // detiene el envío
  }

  return true; // todo válido
}
</script>
