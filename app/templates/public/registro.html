{% extends 'base.html' %}

{% block title %} Registro {% endblock %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style_registro.css') }}">
{% endblock %}

{% block content %}
<form class="formulario" 
      action="{{ url_for('user_bp.registro') }}" 
      method="POST"
      onsubmit="return validarFormulario()">

    <h2>Datos del paciente</h2>

    <fieldset id="datosPersonales">
        <legend>Datos personales</legend>
        <div class="fila">
            <input type="text" id="paterno" name="paterno" placeholder="Apellido paterno" 
                   required pattern="^[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+$" title="Solo letras">
            <input type="text" id="materno" name="materno" placeholder="Apellido materno"
                   pattern="^[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+$" title="Solo letras">
        </div>

        <div class="fila">
            <input type="text" id="nombre" name="nombre" placeholder="Nombre(s)" required
                   pattern="^[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+$" title="Solo letras">
            <input type="number" id="edad" name="edad" placeholder="Edad" min="1" max="120" required>
            <input type="date" name="fecha_nacimiento" required>
        </div>

        <div class="fila">
            <label>Sexo:</label>
            <label><input type="radio" name="sexo" value="F" required> F</label>
            <label><input type="radio" name="sexo" value="M"> M</label>
        </div>
    </fieldset>

    <fieldset id="datosContacto">
        <legend>Datos de contacto</legend>
        <div class="fila">
            <input type="text" name="direccion" placeholder="Dirección">
        <input type="tel" id="celular" name="celular" placeholder="Teléfono celular" 
               pattern="^[0-9]{10}$" title="Debe contener 10 dígitos" required>
        </div>
        
        
    </fieldset>
    <fieldset id="datosCuenta">
            <legend>Datos de cuenta</legend>
            <div class="fila">
                <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                <input type="password" id="password" name="password" placeholder="Contraseña"
               minlength="8" maxlength="20" required>
            </div>
        </fieldset>

    <div class="botones">
        <button type="reset">Cancelar</button>
        <button type="submit">Aceptar</button>
    </div>
</form>

<script>
function validarFormulario() {
    const pass = document.getElementById('password').value;
    if (pass.length < 8 || pass.length > 20) {
        alert("La contraseña debe tener entre 8 y 20 caracteres.");
        return false;
    }
    return true;
}
</script>

{% endblock %}
