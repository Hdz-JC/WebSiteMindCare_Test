
{% block title %} Registro {% endblock %}

{% block style %}
    <!--Style-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_registro.css') }}">
{% endblock %}

{% extends 'base.html' %}

{% block content %}
    <form class="formulario">
        <h2>Datos del paciente</h2>
        <fieldset id="datosPersonales">
            <legend>Datos personales</legend>
            <div class="fila">
                <input type="text" name="paterno" placeholder="Apellido paterno">
                <input type="text" name="materno" placeholder="Apellido materno">
            </div>
            <div class="fila">
                <input type="text" name="nombre" placeholder="Nombre(s)">
                <input type="number" name="edad" placeholder="Edad">
                <input type="date" name="fecha_nacimiento" placeholder="Fecha de nacimiento">
            </div>
            <div class="fila">
                <label>Sexo:</label>
                <label><input type="radio" name="sexo" value="F"> F</label>
                <label><input type="radio" name="sexo" value="M"> M</label>
            </div>
        </fieldset>
        <fieldset id="datosContacto">
            <legend>Datos de contacto</legend>
            <input type="text" name="direccion" placeholder="Dirección">
            <input type="tel" name="celular" placeholder="Teléfono celular">
            <input type="email" name="email" placeholder="Correo electrónico">
        </fieldset>
        <div class="botones">
            <button type="button">Cancelar</button>
            <button type="submit">Aceptar</button>
        </div>
    </form>
{% endblock %}
