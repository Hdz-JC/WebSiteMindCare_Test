{% extends 'base.html' %}

{% block title %} Registro {% endblock %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style_registro.css') }}">
{% endblock %}

{% block content %}
<form class="formulario" 
      action="{{ url_for('main_bp.registro') }}" 
      method="POST"
      onsubmit="validarRegistro()">

    <h2>Datos del paciente</h2>

    <fieldset id="datosPersonales">
        <legend>Datos personales</legend>
        <div class="fila">
            <input type="text" name="paterno" placeholder="Apellido paterno" required>
            <input type="text" name="materno" placeholder="Apellido materno">
        </div>
        <div class="fila">
            <input type="text" name="nombre" placeholder="Nombre(s)" required>
            <input type="number" name="edad" placeholder="Edad" min="1" max="120" required>
            <input type="date" name="fecha_nacimiento" placeholder="Fecha de nacimiento">
        </div>
        <div class="fila">
            <label>Sexo:</label>
            <label><input type="radio" name="sexo" value="F" required> F</label>
            <label><input type="radio" name="sexo" value="M"> M</label>
        </div>
    </fieldset>

    <fieldset id="datosContacto">
        <legend>Datos de contacto</legend>
        <input type="text" name="direccion" placeholder="Dirección">
        <input type="tel" name="celular" placeholder="Teléfono celular">
        <input type="email" name="email" placeholder="Correo electrónico" required>
        <input type="password" name="password" placeholder="Contraseña" required>
    </fieldset>

    <div class="botones">
        <button type="reset">Cancelar</button>
        <button type="submit">Aceptar</button>
    </div>
</form>
{% endblock %}

<script>
function validarRegistro() {
  const paterno = document.querySelector('input[name="paterno"]').value.trim();
  const materno = document.querySelector('input[name="materno"]').value.trim();
  const nombre = document.querySelector('input[name="nombre"]').value.trim();
  const edad = document.querySelector('input[name="edad"]').value.trim();
  const celular = document.querySelector('input[name="celular"]').value.trim();
  const email = document.querySelector('input[name="email"]').value.trim();
  const password = document.querySelector('input[name="password"]').value.trim();

  const nombreRegex = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{2,30}$/;
  const edadRegex = /^(?:[1-9][0-9]?|1[01][0-9]|120)$/;
  const celularRegex = /^\d{10}$/;
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/;

  if (!nombreRegex.test(paterno)) {
    Swal.fire("Error", "Apellido paterno inválido (solo letras y espacios).", "error");
    return false;
  }

  if (materno && !nombreRegex.test(materno)) {
    Swal.fire("Error", "Apellido materno inválido.", "error");
    return false;
  }

  if (!nombreRegex.test(nombre)) {
    Swal.fire("Error", "Nombre inválido (solo letras y espacios).", "error");
    return false;
  }

  if (!edadRegex.test(edad)) {
    Swal.fire("Error", "Edad inválida (1-120).", "error");
    return false;
  }

  if (celular && !celularRegex.test(celular)) {
    Swal.fire("Error", "Teléfono celular debe tener 10 dígitos numéricos.", "error");
    return false;
  }

  if (!emailRegex.test(email)) {
    Swal.fire("Error", "Correo electrónico inválido.", "error");
    return false;
  }

  if (!passwordRegex.test(password)) {
    Swal.fire("Error", "La contraseña debe tener al menos 6 caracteres, con letras y números.", "error");
    return false;
  }

  return true;
}
</script>
