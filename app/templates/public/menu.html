<style>
.logo {
  cursor: pointer;
}
</style>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <!-- Logo -->
    <div class="logo">
      <a href="{{ url_for('user_bp.inicio') }}">
        <img src="{{ url_for('static', filename='img/logoApp.png') }}">
      </a>
    </div>

    <!-- Menú -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('user_bp.inicio') }}">Inicio</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('user_bp.agendar') }}">Agendar</a>
        </li>


        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('user_bp.quienesSomos') }}">Quiénes somos</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('user_bp.ubicacion') }}">Ubicación</a>
        </li>

        <!-- Login / Usuario -->
        {% if session.get('user_id') %}
          <!-- Si el usuario está logeado -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" 
               id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle me-1"></i>
              {{ session.get('user_nombre', 'Usuario') }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
              <li><h6 class="dropdown-header">{{ session.get('user_email') }}</h6></li>
              <li><a class="dropdown-item text-danger" href="{{ url_for('user_bp.logout') }}">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
              </a></li>
            </ul>
          </li>
        {% else %}
          <!-- Si no está logeado -->
          <li class="nav-item">
            <a class="nav-link" data-bs-toggle="modal" data-bs-target="#loginModal">
              <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
