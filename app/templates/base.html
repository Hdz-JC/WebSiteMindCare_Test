<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block title %} Pagina base {% endblock %} </title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!--Style-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block style %}{% endblock %}
</head>
<body>
    {% include 'public/menu.html' %}
    {% block content %}{% endblock %}
    {% include 'components/login_modal.html' %}

    <!-- Flash messages con SweetAlert2 -->
    <script>
    /* jinja2-flash-block-start */
        {% set flashed_messages = get_flashed_messages(with_categories=true) %}
        {% if flashed_messages %}
        {% for category, message in flashed_messages %}
            Swal.fire({
            icon: "{{ 'success' if category.lower() == 'success' else 'error' if category.lower() == 'danger' else 'info' }}",
            title: {{ message|tojson }},
            confirmButtonColor: '#3085d6',
            confirmButtonText: 'OK'
            });
        {% endfor %}
        {% endif %}
        /* jinja2-flash-block-end */
    </script>

</body>
</html>
